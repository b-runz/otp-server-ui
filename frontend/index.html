<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trip Planner</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main id="app">
    <h1>Trip Planner</h1>
    <form id="trip-form" novalidate>
      <fieldset id="mode-toggle" class="toggle-group"><legend>Mode</legend></fieldset>
      <fieldset id="time-toggle" class="toggle-group"><legend>Time</legend></fieldset>

      <div class="datetime-row">
        <input id="date-input" type="date" aria-label="Date" />
        <input id="time-input" type="time" aria-label="Time" />
      </div>

      <div class="address-fields">
        <div class="address-field">
          <button type="button" id="from-favorite-star" class="favorite-star" hidden aria-label="Toggle favorite"></button>
          <label for="from-input">From</label>
          <input id="from-input" type="text" autocomplete="off" />
          <button type="button" id="from-clear" class="clear-field" aria-label="Clear From">✕</button>
          <ul id="from-suggestions" class="suggestions" hidden></ul>
        </div>

        <div class="address-field">
          <button type="button" id="to-favorite-star" class="favorite-star" hidden aria-label="Toggle favorite"></button>
          <label for="to-input">To</label>
          <input id="to-input" type="text" autocomplete="off" />
          <button type="button" id="to-clear" class="clear-field" aria-label="Clear To">✕</button>
          <button type="button" id="swap-button" class="swap-button" aria-label="Swap From and To">⇅</button>
          <ul id="to-suggestions" class="suggestions" hidden></ul>
        </div>
      </div>

      <label class="switch-row" for="prefer-hubs-checkbox">
        Prefer transit hubs
        <span class="switch">
          <input type="checkbox" id="prefer-hubs-checkbox" />
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>

      <label class="max-transfers-row" for="max-transfers-select">
        Max connections
        <select id="max-transfers-select">
          <option value="">Unlimited</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </label>

      <button type="submit" id="search-button" class="button-primary">Search</button>
      <button type="button" id="drop-me-off-button" class="button-outline">Drop me off</button>
    </form>

    <div id="error-banner" role="alert" hidden></div>
    <div id="results"></div>
    <div id="nearby-routes"></div>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
